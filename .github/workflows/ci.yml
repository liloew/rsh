name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install differential test shells
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y dash bash
          else
            brew install dash bash
          fi
      - name: Reference shell versions and hashes
        run: cargo run --locked --bin spec-runner -- --versions
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Build Rust documentation
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify spec expectations against references
        run: cargo run --locked --bin spec-runner -- verify-references --report-dir target/spec-references
      - name: Run rsh conformance cases
        run: cargo run --locked --bin spec-runner -- run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-reports-${{ matrix.os }}
          path: |
            target/spec-report.json
            target/spec-junit.xml
            target/spec-references/
      - name: Repeat PTY job-control and editor tests to detect races
        run: |
          for iteration in $(seq 1 20); do
            cargo test --locked --test pty job_control:: -- --test-threads=1 || exit 1
            cargo test --locked --test pty interactive:: -- --test-threads=1 || exit 1
          done
