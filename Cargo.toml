[package]
name = "rsh"
version = "0.1.0"
edition = "2024"
default-run = "rsh"
description = "A Unix shell written in Rust with POSIX-oriented scripting and an interactive line editor"
license = "Apache-2.0"
readme = "README.md"
keywords = ["shell", "posix", "terminal", "repl"]
categories = ["command-line-utilities"]

[dependencies]
thiserror = "2"
nix = { version = "0.31", features = ["fs", "process", "signal"] }
signal-hook = "0.3"
reedline = { version = "0.46", features = ["external_printer", "idle_callback"] }
nu-ansi-term = "0.50"

[dev-dependencies]
expectrl = "0.8"

[[bin]]
name = "spec-sandbox"
path = "src/sys/spec-sandbox.rs"
