[package]
name = "rsh"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2"
nix = { version = "0.31", features = ["fs", "process", "signal"] }
signal-hook = "0.3"
reedline = { version = "0.46", features = ["external_printer", "idle_callback"] }
nu-ansi-term = "0.50"

[dev-dependencies]
expectrl = "0.8"
